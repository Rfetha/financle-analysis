[project]
name = "sonar"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "yfinance>=0.2.40",
]

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["slow: gerçek dış ağ çağrısı (yfinance) — varsayılan koşuda atlanır"]
addopts = "-m 'not slow'"
