[project]
name = "sonar"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "yfinance>=0.2.40",
  "langgraph>=0.2.50",
  "langchain>=0.3",
  "langchain-anthropic>=0.3",
  "loguru>=0.7.3",
  "langchain-openai>=1.3.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "defusedxml>=0.7",
  "websockets>=13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pyinstaller>=6.5"]

[project.scripts]
sonar = "sonar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["slow: gerçek dış ağ çağrısı (yfinance) — varsayılan koşuda atlanır"]
addopts = "-m 'not slow'"
asyncio_mode = "auto"
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
